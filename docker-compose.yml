services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    container_name: wifi-share-app
    ports:
      - "${APP_PORT:-3000}:3000"
      - "${WS_PORT:-3001}:${WS_PORT:-3001}"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      WS_PORT: ${WS_PORT:-3001}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=384}
    mem_limit: ${MEM_LIMIT:-512m}
    restart: unless-stopped
