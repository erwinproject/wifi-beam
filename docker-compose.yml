services:
  app:
    build: .
    container_name: wifi-share-app
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      WS_PORT: 3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
      NODE_OPTIONS: --max-old-space-size=384
    mem_limit: 512m
    restart: unless-stopped
